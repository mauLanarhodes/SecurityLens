services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in .env; see docs/pilot-setup.md}"
      POSTGRES_DB: securitylens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d securitylens"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: "postgres://lens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/securitylens?sslmode=disable"
      REDIS_ADDR: redis:6379
      PORT: "8080"
      BIND_ADDR: "0.0.0.0"
      AUTH_OPERATOR_TOKEN: "${AUTH_OPERATOR_TOKEN:?Generate AUTH_OPERATOR_TOKEN in .env; see docs/pilot-setup.md}"
      AUTH_VIEWER_TOKEN: "${AUTH_VIEWER_TOKEN:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      # A pilot starts empty. Enable only in a separate synthetic demo stack.
      SEED_ON_START: "${SEED_ON_START:-false}"
      SEED_LOGS: "${SEED_LOGS:-200000}"
      SEED_DAYS: "${SEED_DAYS:-21}"
      SEED_SEED: "${SEED_SEED:-1}"
      # Backend-only credentials. OpenAI is the default provider; an empty
      # selected-provider key uses the deterministic mock in auto mode.
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_MODE: "${LLM_MODE:-mock}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
    # data is isolated; outbound lets the backend reach the configured LLM.
    networks: [data, app, outbound]

  web:
    build:
      context: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    networks: [app]

networks:
  data:
    internal: true
  app:
    internal: true
  outbound:

volumes:
  pgdata:
