services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: lens
      POSTGRES_DB: securitylens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d securitylens"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://lens:lens@db:5432/securitylens?sslmode=disable
      REDIS_ADDR: redis:6379
      PORT: "8080"
      # Seed on first boot if the logs table is empty.
      SEED_ON_START: "true"
      SEED_LOGS: "${SEED_LOGS:-200000}"
      SEED_DAYS: "${SEED_DAYS:-21}"
      SEED_SEED: "${SEED_SEED:-1}"
      # Empty key selects the deterministic mock; set ANTHROPIC_API_KEY in .env
      # to switch triage/investigation/rule-gen to live Anthropic calls.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LLM_MODE: "${LLM_MODE:-auto}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
